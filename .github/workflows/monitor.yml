name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            // 「週」表示に切り替える
            const weekButton = page.getByText('週', { exact: true }).first();

            if (await weekButton.count()) {
              await weekButton.click();
              await page.waitForTimeout(3000);
            }

            const bodyText = await page.locator('body').innerText();

            console.log('===== PAGE TEXT =====');
            console.log(bodyText);
            console.log('=====================');

            // まず9/24がページ上に存在することを確認
            const hasTargetDate =
              bodyText.includes('9/24') ||
              bodyText.includes('09/24') ||
              bodyText.includes('9月24日') ||
              bodyText.includes('24日');

            if (!hasTargetDate) {
              console.log('9/24が現在の表示範囲にありません。');
              await browser.close();
              return;
            }

            /*
             * 現段階では、実際のカレンダーDOMをログに出して
             * 9/24の空き枠の表現を確定させます。
             *
             * 予約サイトはJavaScriptでカレンダーを生成するため、
             * ここで一度実際のDOMを確認してから
             * 「○」「予約する」等の判定を確定します。
             */

            console.log('9/24を検出しました。');
            console.log('空き枠判定のためDOMを確認します。');

            await browser.close();
          })();
          EOF
