name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            try {
              // ページを開く
              await page.goto(url, {
                waitUntil: 'networkidle',
                timeout: 60000
              });

              // 「週」表示に切り替える
              const weekButton =
                page.getByText('週', { exact: true }).first();

              if (await weekButton.count()) {
                await weekButton.click();
                await page.waitForTimeout(3000);
              }

              // 9/24のイベントを取得
              const events = await page.locator(
                'a.fc-time-grid-event'
              ).evaluateAll(elements => {

                return elements.map(el => {

                  const start =
                    el.querySelector(
                      'input.service_unit_service_start_datetime'
                    )?.value || '';

                  const end =
                    el.querySelector(
                      'input.service_unit_service_end_datetime'
                    )?.value || '';

                  const time =
                    el.querySelector('.fc-time')?.innerText || '';

                  const iconClass =
                    el.querySelector(
                      '.service_icon i'
                    )?.className || '';

                  return {
                    start,
                    end,
                    time,
                    iconClass
                  };

                }).filter(event =>
                  event.start.startsWith('2026/09/24')
                );

              });

              console.log('');
              console.log('===== 2026/09/24 EVENTS =====');
              console.log(JSON.stringify(events, null, 2));
              console.log('===== END =====');
              console.log('');

              // イベントが取得できなかった場合
              if (events.length === 0) {
                console.log(
                  '9/24のイベントが取得できませんでした。'
                );

                process.exit(1);
              }

              // fa-times = 満席
              // fa-times以外 = 空きの可能性あり
              const available = events.filter(event =>
                !event.iconClass.includes('fa-times')
              );

              console.log(
                `9/24: ${events.length}枠中 ${available.length}枠に空きの可能性あり`
              );

              // 空きなし
              if (available.length === 0) {
                console.log('現在、9/24に空きはありません。');
                await browser.close();
                return;
              }

              // 空きあり
              console.log('===== AVAILABLE =====');

              for (const event of available) {
                console.log(
                  `${event.time} ${event.iconClass}`
                );
              }

              console.log('=====================');

              // ntfy通知
              const topic = process.env.NTFY_TOPIC;

              if (!topic) {
                console.log(
                  'NTFY_TOPIC が設定されていません。'
                );

                await browser.close();
                return;
              }

              const message =
                '高千穂峡貸しボート 9/24 に空きが出ました！\n\n' +
                available
                  .map(event => `・${event.time}`)
                  .join('\n') +
                '\n\n予約サイト:\n' +
                url;

              const response = await fetch(
                `https://ntfy.sh/${topic}`,
                {
                  method: 'POST',
                  headers: {
                    'Title': '高千穂峡ボート空きあり',
                    'Priority': 'high',
                    'Tags': 'boat,warning'
                  },
                  body: message
                }
              );

              console.log(
                'ntfy response:',
                response.status,
                await response.text()
              );

              await browser.close();

            } catch (error) {

              console.error(
                'ERROR:',
                error
              );

              await browser.close();

              process.exit(1);
            }

          })();
          EOF
