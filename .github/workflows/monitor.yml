name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            console.log('===== OPENING PAGE =====');

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            await page.waitForTimeout(3000);

            console.log('===== SWITCH TO WEEK VIEW =====');

            const weekButton =
              page.getByText('週', { exact: true }).first();

            if (await weekButton.count()) {
              await weekButton.click();
              await page.waitForTimeout(3000);
              console.log('週表示に切り替えました。');
            } else {
              console.log('週ボタンが見つかりませんでした。');
            }

            console.log('===== SEARCHING 9/24 =====');

            const matches =
              await page.locator('text=9/24').evaluateAll(elements =>
                elements.map((el, i) => ({
                  index: i,
                  tag: el.tagName,
                  text: el.innerText?.slice(0, 500),
                  class: el.className,
                  id: el.id,
                  outerHTML: el.outerHTML.slice(0, 3000),
                  parentHTML:
                    el.parentElement?.outerHTML.slice(0, 5000)
                }))
              );

            console.log('===== 9/24 ELEMENTS =====');
            console.log(JSON.stringify(matches, null, 2));
            console.log('=========================');

            console.log('===== CALENDAR LINKS =====');

            const links = await page.locator('a').evaluateAll(elements =>
              elements
                .map(el => ({
                  text: (el.innerText || '').trim(),
                  href: el.href || '',
                  class: el.className,
                  outerHTML: el.outerHTML.slice(0, 1500)
                }))
                .filter(x =>
                  x.text ||
                  x.href
                )
            );

            console.log(JSON.stringify(links, null, 2));

            console.log('===== END =====');

            await browser.close();
          })();
          EOF
