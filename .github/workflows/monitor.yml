name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            await page.waitForTimeout(3000);

            // 週表示に切り替える
            const weekButton = page.getByText('週', { exact: true }).first();

            if (await weekButton.count()) {
              await weekButton.click();
              await page.waitForTimeout(3000);
            }

            console.log('===== 9/24 RELATED ELEMENTS =====');

            const elements = await page.locator('*').evaluateAll(els => {
              return els
                .filter(el => {
                  const text = (el.innerText || '').trim();
                  return text.includes('9/24') ||
                         text.includes('9月24日');
                })
                .slice(0, 30)
                .map(el => ({
                  tag: el.tagName,
                  class: el.className,
                  id: el.id,
                  text: (el.innerText || '').trim().slice(0, 500),
                  html: el.outerHTML.slice(0, 3000)
                }));
            });

            console.log(JSON.stringify(elements, null, 2));

            console.log('===== BUTTONS =====');

            const buttons = await page.locator('button, a').evaluateAll(els => {
              return els.map(el => ({
                tag: el.tagName,
                text: (el.innerText || '').trim(),
                class: el.className,
                href: el.href || '',
                html: el.outerHTML.slice(0, 1000)
              })).filter(x =>
                x.text ||
                x.href
              );
            });

            console.log(JSON.stringify(buttons, null, 2));

            await browser.close();
          })();
          EOF
