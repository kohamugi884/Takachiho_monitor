name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            // 「週」表示に切り替える
            const weekButton = page.getByText('週', { exact: true }).first();

            if (await weekButton.count()) {
              await weekButton.click();
              await page.waitForTimeout(3000);
            }

            // 2026/09/24 のイベントを取得
            const events = await page.locator(
              'a.fc-time-grid-event'
            ).evaluateAll(elements => {

              return elements.map((el, index) => {

                const start =
                  el.querySelector(
                    'input.service_unit_service_start_datetime'
                  )?.value || '';

                const end =
                  el.querySelector(
                    'input.service_unit_service_end_datetime'
                  )?.value || '';

                const serviceSession =
                  el.querySelector(
                    'input.service_unit_service_session_cd'
                  )?.value || '';

                const serviceCd =
                  el.querySelector(
                    'input.service_unit_service_cd'
                  )?.value || '';

                const time =
                  el.querySelector('.fc-time')?.innerText || '';

                const icon =
                  el.querySelector('.service_icon')?.innerText || '';

                const iconClass =
                  el.querySelector('.service_icon i')?.className || '';

                return {
                  index,
                  start,
                  end,
                  time,
                  serviceSession,
                  serviceCd,
                  icon,
                  iconClass
                };

              }).filter(event =>
                event.start.startsWith('2026/09/24')
              );

            });

            console.log('');
            console.log('===== 2026/09/24 EVENTS =====');
            console.log(JSON.stringify(events, null, 2));
            console.log('===== END =====');
            console.log('');

            await browser.close();

          })();
          EOF
