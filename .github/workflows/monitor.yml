name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            await page.waitForTimeout(3000);

            // 週表示
            const weekButton =
              page.getByText('週', { exact: true }).first();

            if (await weekButton.count()) {
              await weekButton.click();
              await page.waitForTimeout(3000);
            }

            console.log('===== 9/24 COLUMN =====');

            // 9/24のヘッダー
            const header = page.locator(
              'th[data-date="2026-09-24"]'
            ).first();

            if (!(await header.count())) {
              console.log('9/24 header not found');
              await browser.close();
              return;
            }

            console.log(
              await header.evaluate(el => el.outerHTML)
            );

            console.log('===== CALENDAR CONTAINERS =====');

            // FullCalendarのカレンダー本体を調査
            const calendars = await page.locator(
              '.fc-view, .fc-content, .fc-body, .fc-time-grid, .fc-slats'
            ).evaluateAll(elements =>
              elements.map(el => ({
                tag: el.tagName,
                class: el.className,
                text: (el.innerText || '')
                  .trim()
                  .slice(0, 5000),
                html: el.outerHTML.slice(0, 15000)
              }))
            );

            console.log(
              JSON.stringify(calendars, null, 2)
            );

            console.log('===== EVENTS =====');

            // FullCalendarのイベント要素を調査
            const events = await page.locator(
              '.fc-event, .fc-time-grid-event, .fc-event-container, [data-event-id]'
            ).evaluateAll(elements =>
              elements.map((el, index) => ({
                index,
                tag: el.tagName,
                class: el.className,
                id: el.id,
                text: (el.innerText || '')
                  .trim()
                  .slice(0, 1000),
                href: el.href || '',
                dataDate: el.getAttribute('data-date'),
                dataStart: el.getAttribute('data-start'),
                dataEnd: el.getAttribute('data-end'),
                outerHTML: el.outerHTML.slice(0, 5000)
              }))
            );

            console.log(
              JSON.stringify(events, null, 2)
            );

            console.log('===== 9/24 RELATED EVENTS =====');

            // 9/24列付近にある要素を調べる
            const related = await page.locator(
              '.fc-event, .fc-time-grid-event, .fc-event-container'
            ).evaluateAll(elements =>
              elements.map((el, index) => {
                const rect = el.getBoundingClientRect();

                return {
                  index,
                  tag: el.tagName,
                  class: el.className,
                  text: (el.innerText || '')
                    .trim()
                    .slice(0, 500),
                  href: el.href || '',
                  left: rect.left,
                  right: rect.right,
                  top: rect.top,
                  bottom: rect.bottom,
                  html: el.outerHTML.slice(0, 5000)
                };
              })
            );

            console.log(
              JSON.stringify(related, null, 2)
            );

            console.log('===== END =====');

            await browser.close();
          })();
          EOF
