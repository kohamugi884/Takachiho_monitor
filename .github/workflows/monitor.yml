name: Takachiho Boat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check reservation
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo'
            });

            const url =
              'https://eipro.jp/takachiho1/eventCalendars/index';

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            await page.waitForTimeout(3000);

            // 週表示へ
            const weekButton =
              page.getByText('週', { exact: true }).first();

            if (await weekButton.count()) {
              await weekButton.click();
              await page.waitForTimeout(3000);
            }

            console.log('===== FIND 9/24 =====');

            // 9/24の要素を取得
            const dateInfo = await page.locator('span.notranslate')
              .filter({ hasText: '9/24' })
              .first()
              .evaluate(el => {

                function simplify(node, depth = 0) {
                  if (!node || depth > 6) return null;

                  return {
                    tag: node.tagName,
                    id: node.id || '',
                    class: typeof node.className === 'string'
                      ? node.className
                      : '',
                    text: (node.innerText || '')
                      .trim()
                      .slice(0, 2000),
                    children: Array.from(node.children)
                      .slice(0, 30)
                      .map(child => simplify(child, depth + 1))
                  };
                }

                return simplify(el.parentElement);
              });

            console.log(
              JSON.stringify(dateInfo, null, 2)
            );

            console.log('===== ELEMENTS AROUND 9/24 =====');

            const surrounding =
              await page.locator('span.notranslate')
                .filter({ hasText: '9/24' })
                .first()
                .evaluate(el => {

                  let node = el;

                  const result = [];

                  for (let i = 0; i < 8 && node; i++) {
                    result.push({
                      level: i,
                      tag: node.tagName,
                      id: node.id || '',
                      class:
                        typeof node.className === 'string'
                          ? node.className
                          : '',
                      text: (node.innerText || '')
                        .trim()
                        .slice(0, 5000),
                      html: node.outerHTML.slice(0, 10000)
                    });

                    node = node.parentElement;
                  }

                  return result;
                });

            console.log(
              JSON.stringify(surrounding, null, 2)
            );

            console.log('===== ALL ELEMENTS WITH 9/24 =====');

            const allMatches =
              await page.locator('*').evaluateAll(elements =>
                elements
                  .filter(el => {
                    const text =
                      (el.innerText || '').trim();

                    return text === '9/24';
                  })
                  .map(el => ({
                    tag: el.tagName,
                    id: el.id || '',
                    class:
                      typeof el.className === 'string'
                        ? el.className
                        : '',
                    html:
                      el.parentElement?.parentElement
                        ?.outerHTML
                        .slice(0, 12000)
                  }))
                  .slice(0, 10)
              );

            console.log(
              JSON.stringify(allMatches, null, 2)
            );

            console.log('===== END =====');

            await browser.close();
          })();
          EOF
